# POC Task Frontmatter Contract — VulnForge
# decide 为 poc-verify 创建的 POC 任务项：target 指向要复现的 finding report.yaml。
# Strict validation applies to frontmatter only. Body is taught by poc.template.md.
$schema: http://json-schema.org/draft-07/schema#
$id: poc.schema.yaml
title: POC Task Frontmatter
type: object
required:
  - round
  - id
  - status
  - target
properties:
  round:
    type: integer
    minimum: 0
  id:
    type: string
    pattern: "^POC-R\\d+(-[A-Z]\\d+)+-H\\d+$"
  status:
    type: string
    enum: [pending, done, closed]
  target:
    type: string
    description: 要复现的 finding 路径（findings/<BUG-id>/report.yaml）。
additionalProperties: false
