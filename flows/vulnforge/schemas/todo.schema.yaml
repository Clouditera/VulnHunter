# Todo Task Frontmatter Contract — VulnForge
# 通用 todo 任务 frontmatter（onboard 等没有专属 schema 的任务类型）。
# Strict validation applies to frontmatter only (routing fields).
$schema: http://json-schema.org/draft-07/schema#
$id: todo.schema.yaml
title: Todo Task Frontmatter
type: object
required:
  - round
  - id
  - status
properties:
  round:
    type: integer
    minimum: 0
  id:
    type: string
    description: 任务 ID，命名按任务类型（如 onboard-R1）。
  status:
    type: string
    enum: [pending, done, closed]
additionalProperties: true
