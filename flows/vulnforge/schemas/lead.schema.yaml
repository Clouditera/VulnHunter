# Lead Frontmatter Contract — VulnForge
# Strict validation applies to frontmatter only (routing fields).
# Body structure (线索 / 锚点 / 为什么是 lead) is taught by lead.template.md.
$schema: http://json-schema.org/draft-07/schema#
$id: lead.schema.yaml
title: Lead Frontmatter
type: object
required:
  - round
  - id
  - type
  - status
properties:
  round:
    type: integer
    minimum: 0
  id:
    type: string
    pattern: "^LEAD-R\\d+(-[A-Z]\\d+)+-L\\d+$"
  type:
    type: string
    enum: [knowledge, threat-model, hunt]
    description: |
      decide 处理方式分类：
      knowledge → 沉淀 wiki；threat-model → 合并 threat-model；hunt → 派 cognize/hunt 或关闭。
  status:
    type: string
    enum: [pending, done, closed]
additionalProperties: false
