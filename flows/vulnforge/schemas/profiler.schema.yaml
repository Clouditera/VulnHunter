# Project Profiler Schema — VulnForge
$schema: http://json-schema.org/draft-07/schema#
$id: profiler.schema.yaml
title: Project Profiler
description: 项目画像 — 客观事实清单

type: object
required:
  - basic_info
  - code_stats
  - tech_stack
properties:
  basic_info:
    type: object
    required:
      - project_name
    properties:
      project_name:
        type: string
    additionalProperties: false

  code_stats:
    type: object
    required:
      - file_count
      - loc
      - languages
    properties:
      file_count:
        type: integer
        minimum: 0
      loc:
        type: integer
        minimum: 0
      languages:
        type: array
        items:
          type: object
          required:
            - name
            - percentage
          properties:
            name:
              type: string
            percentage:
              type: number
              minimum: 0
              maximum: 100
          additionalProperties: false
    additionalProperties: false

  tech_stack:
    type: object
    properties:
      build_system:
        type: string
      package_manager:
        type: string
      main_dependencies:
        type: array
        items:
          type: string
    additionalProperties: false

  structure:
    type: object
    properties:
      type:
        type: string
        description: "项目结构类型（monorepo / single-package / multi-module 等）"
      packages:
        type: array
        items:
          type: object
          required:
            - name
            - path
          properties:
            name:
              type: string
            path:
              type: string
          additionalProperties: false
      main_dirs:
        type: array
        items:
          type: string
      test_dirs:
        type: array
        items:
          type: string
    additionalProperties: false

additionalProperties: false
