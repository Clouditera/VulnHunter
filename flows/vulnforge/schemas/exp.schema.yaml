# EXP Task Frontmatter Contract — VulnForge
# decide 为 ev-assess 创建的 EXP 任务项：target 指向一个已 POC 复现的 finding report.yaml。
# Strict validation applies to frontmatter only. Body is taught by exp.template.md / ev-assess.md.
$schema: http://json-schema.org/draft-07/schema#
$id: exp.schema.yaml
title: EXP Task Frontmatter
type: object
required:
  - round
  - id
  - status
  - target
properties:
  round:
    type: integer
    minimum: 0
  id:
    type: string
    pattern: "^EXP-R\\d+-E\\d+$"
  status:
    type: string
    enum: [pending, done, closed]
  target:
    type: string
    pattern: "^findings/BUG-.+/report\\.yaml$"
    description: 要做真实影响评估的主 finding report.yaml 路径。
additionalProperties: false
