version: "1.0"
timeout: 600
recursion_limit: 8
artifacts:
  agents: agents/
  tasks: tasks/
  schemas: schemas/
  models_json: models.json
inputs:
  work_dir:
    type: path
  output_dir:
    type: path
  dynamic_enabled:
    type: str
    required: true
  result_path:
    type: path
    required: true
defaults:
  model: ${env.V_PREPARE_MODEL}
  max_parallel: 1
  agent: prepare-agent.md
  tools: [read, write, edit, bash]
stages:
  - id: prepare
    name: Prepare
    type: single
    task: prepare.md
    prompt: |
      Dynamic validation enabled: ${flow_inputs.dynamic_enabled}
      Write the final result to ${flow_inputs.result_path}.
    timeout: 600
    error_strategy: stop
