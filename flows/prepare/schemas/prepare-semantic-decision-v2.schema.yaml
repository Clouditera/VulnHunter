$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.vulnagent.local/prepare/minimal-semantic-decision/2.0"
title: VulnAgent Prepare Status-specific Minimal Semantic Decision v2.0
type: object
additionalProperties: false
required: [schema_version, decision]
properties:
  schema_version: {const: "2.0"}
  decision:
    oneOf:
      - $ref: "#/$defs/completeDecision"
      - $ref: "#/$defs/incompleteDecision"
      - $ref: "#/$defs/uncertainDecision"

$defs:
  confidence:
    type: number
    minimum: 0
    maximum: 1

  shortText:
    type: string
    minLength: 1
    maxLength: 512
    pattern: "^[^\\x00-\\x1F]*$"

  projectText:
    type: string
    minLength: 1
    maxLength: 256
    pattern: "^[^\\x00-\\x1F]*$"

  subjectText:
    type: string
    minLength: 1
    maxLength: 160
    pattern: "^[^\\x00-\\x1F]*$"

  identifier:
    type: string
    minLength: 1
    maxLength: 64
    pattern: "^[a-z][a-z0-9_.:-]*$"

  relativePath:
    type: string
    minLength: 1
    maxLength: 512
    pattern: "^(?:\\.|(?!/)(?![A-Za-z]:)(?!.*\\\\)(?!.*(?:^|/)\\.\\.(?:/|$))[^\\x00-\\x1F]+)$"

  submissionShape:
    type: string
    enum: [project, monorepo, multi_project, patch_set, test_corpus, vendor_fragment, unknown]

  evidenceSignal:
    type: string
    enum:
      - project_metadata
      - build_entrypoint
      - dependency_declaration
      - missing_reference
      - source_tree_shape
      - generated_source_reference
      - submodule_reference
      - container_definition
      - full_system_indicator
      - asset_reference
      - documentation
      - other

  completeEvidence:
    type: object
    additionalProperties: false
    required: [path, signal, observation]
    properties:
      path: {$ref: "#/$defs/relativePath"}
      line_start: {type: integer, minimum: 1, maximum: 10000000}
      line_end: {type: integer, minimum: 1, maximum: 10000000}
      signal: {$ref: "#/$defs/evidenceSignal"}
      observation: {$ref: "#/$defs/shortText"}

  evidenceClaimCode:
    type: string
    enum:
      - patch_submission_detected
      - patch_targets_unsubmitted_base
      - external_base_declared
      - external_base_version_declared
      - base_identity_not_declared
      - test_corpus_submission_detected
      - test_references_unsubmitted_base
      - project_build_entrypoint_present
      - source_body_present
      - generated_authoritative_input_declared_absent
      - generated_output_declared_absent
      - generation_chain_not_submitted
      - submodule_declared_without_content
      - local_path_declared_absent
      - local_first_party_dependency_declared
      - build_manifest_not_submitted
      - asset_required_by_project
      - asset_pointer_without_content
      - configuration_required_by_project
      - configuration_not_submitted
      - isolated_source_body_present
      - project_scope_not_established
      - complete_root_without_scope_relation
      - project_evidence_conflicts
      - decisive_file_unreadable
      - unsupported_manifest_detected
      - manifest_materially_truncated
      - aggregate_test_corpus_detected
      - installer_fetches_external_base
      - build_requires_absent_base_tree

  typedEvidence:
    type: object
    additionalProperties: false
    required: [path, claim]
    properties:
      path: {$ref: "#/$defs/relativePath"}
      claim: {$ref: "#/$defs/evidenceClaimCode"}
      count: {type: integer, minimum: 2, maximum: 100000}
    allOf:
      - if:
          properties: {claim: {const: aggregate_test_corpus_detected}}
          required: [claim]
        then:
          properties:
            count: {type: integer, minimum: 2, maximum: 100000}
          required: [count]
        else:
          properties: {count: false}

  missingIssueCode:
    type: string
    enum:
      - base_source_absent
      - authoritative_first_party_input_absent
      - generated_chain_incomplete
      - submodule_content_absent
      - local_first_party_dependency_absent
      - build_manifest_absent
      - required_build_asset_absent
      - required_runtime_asset_absent
      - required_build_configuration_absent
      - required_runtime_configuration_absent

  qualifierCode:
    type: string
    enum: [base_identity_unresolved, overlay_set, lfs_pointer_only]

  missingIssue:
    type: object
    additionalProperties: false
    required: [code, subject, evidence]
    properties:
      code: {$ref: "#/$defs/missingIssueCode"}
      subject: {$ref: "#/$defs/subjectText"}
      qualifiers:
        type: array
        maxItems: 3
        uniqueItems: true
        items: {$ref: "#/$defs/qualifierCode"}
      evidence:
        type: array
        minItems: 1
        maxItems: 16
        items: {$ref: "#/$defs/typedEvidence"}

  uncertaintyIssueCode:
    type: string
    enum:
      - project_evidence_insufficient
      - project_scope_ambiguous
      - project_evidence_conflicting
      - decisive_file_unreadable
      - manifest_format_unsupported
      - manifest_truncation_blocks_closure

  uncertaintyIssue:
    type: object
    additionalProperties: false
    required: [code, evidence]
    properties:
      code: {$ref: "#/$defs/uncertaintyIssueCode"}
      subject: {$ref: "#/$defs/subjectText"}
      evidence:
        type: array
        minItems: 1
        maxItems: 16
        items: {$ref: "#/$defs/typedEvidence"}

  externalDependency:
    type: object
    additionalProperties: false
    required: [name, role, availability, integrity, required_for, declared_by, locator_hint]
    properties:
      name: {$ref: "#/$defs/shortText"}
      role:
        type: string
        enum: [base_project_source, first_party_component, submodule, generated_source_tool, system_package, language_package, build_tool, runtime_service, dataset, other, unknown]
      availability: {type: string, enum: [present, declared_download, missing, unknown]}
      integrity: {type: string, enum: [pinned, unpinned, unknown, not_applicable]}
      required_for:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items: {type: string, enum: [static_audit, build, poc, exp]}
      declared_by:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/relativePath"}
      locator_hint:
        type: string
        maxLength: 256
        pattern: "^[^\\x00-\\x1F]*$"

  requiredAsset:
    type: object
    additionalProperties: false
    required: [asset_type, asset_id, version_constraint, architecture, os_family, reason]
    properties:
      asset_type: {type: string, enum: [guest_image, firmware, kernel, rootfs, container_image, toolchain, dataset, other]}
      asset_id: {$ref: "#/$defs/identifier"}
      version_constraint: {type: string, minLength: 1, maxLength: 128}
      architecture: {$ref: "#/$defs/identifier"}
      os_family: {$ref: "#/$defs/identifier"}
      reason: {$ref: "#/$defs/shortText"}

  target:
    type: object
    additionalProperties: false
    required: [project_types, languages, build_systems, architectures, os_families, target_classes]
    properties:
      project_types:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      languages:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      build_systems:
        type: array
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      architectures:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      os_families:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      target_classes:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}

  executionRequirements:
    type: object
    additionalProperties: false
    required: [full_system, nested_docker, qemu_guest]
    properties:
      full_system: {type: boolean}
      nested_docker: {type: boolean}
      qemu_guest: {type: boolean}

  dependencyEgress:
    type: object
    additionalProperties: false
    required: [required, reasons]
    properties:
      required: {type: boolean}
      reasons:
        type: array
        maxItems: 16
        items: {$ref: "#/$defs/shortText"}
    allOf:
      - if:
          properties: {required: {const: true}}
          required: [required]
        then:
          properties: {reasons: {type: array, minItems: 1}}
      - if:
          properties: {required: {const: false}}
          required: [required]
        then:
          properties: {reasons: {type: array, maxItems: 0}}

  sandboxRequirements:
    type: object
    additionalProperties: false
    required: [target, required_capabilities, execution, dependency_egress, confidence]
    properties:
      target: {$ref: "#/$defs/target"}
      required_capabilities:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      optional_capabilities:
        type: array
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      execution: {$ref: "#/$defs/executionRequirements"}
      required_assets:
        type: array
        maxItems: 32
        items: {$ref: "#/$defs/requiredAsset"}
      dependency_egress: {$ref: "#/$defs/dependencyEgress"}
      confidence: {$ref: "#/$defs/confidence"}

  completeDecision:
    type: object
    additionalProperties: false
    required:
      - status
      - submission_shape
      - intended_project
      - root_candidates
      - confidence
      - static_visibility
      - evidence
      - external_dependencies
      - sandbox_requirements
    properties:
      status: {const: complete}
      submission_shape: {$ref: "#/$defs/submissionShape"}
      intended_project: {$ref: "#/$defs/projectText"}
      root_candidates:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/relativePath"}
      confidence: {$ref: "#/$defs/confidence"}
      static_visibility: {const: full}
      evidence:
        type: array
        minItems: 1
        maxItems: 64
        items: {$ref: "#/$defs/completeEvidence"}
      external_dependencies:
        type: array
        maxItems: 32
        items: {$ref: "#/$defs/externalDependency"}
      sandbox_requirements: {$ref: "#/$defs/sandboxRequirements"}

  incompleteDecision:
    type: object
    additionalProperties: false
    required: [status, submission_shape, intended_project, root_candidates, confidence, source_visibility, issues]
    properties:
      status: {const: incomplete}
      submission_shape: {$ref: "#/$defs/submissionShape"}
      intended_project: {$ref: "#/$defs/projectText"}
      root_candidates:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/relativePath"}
      confidence: {$ref: "#/$defs/confidence"}
      source_visibility: {type: string, enum: [full, partial, none]}
      issues:
        type: array
        minItems: 1
        maxItems: 32
        items: {$ref: "#/$defs/missingIssue"}

  uncertainDecision:
    type: object
    additionalProperties: false
    required: [status, submission_shape, intended_project, root_candidates, confidence, issues]
    properties:
      status: {const: uncertain}
      submission_shape: {$ref: "#/$defs/submissionShape"}
      intended_project: {$ref: "#/$defs/projectText"}
      root_candidates:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/relativePath"}
      confidence: {$ref: "#/$defs/confidence"}
      issues:
        type: array
        minItems: 1
        maxItems: 16
        items: {$ref: "#/$defs/uncertaintyIssue"}
