$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.vulnagent.local/prepare/semantic-decision/1.0"
title: VulnAgent Prepare Compact Semantic Decision v1.0
type: object
additionalProperties: false
required: [schema_version, assessment, sandbox_requirements]
properties:
  schema_version:
    const: "1.0"
  assessment:
    $ref: "#/$defs/assessment"
  sandbox_requirements:
    oneOf:
      - type: "null"
      - $ref: "#/$defs/sandboxRequirements"
allOf:
  - if:
      properties:
        assessment:
          type: object
          properties:
            status: {const: complete}
          required: [status]
      required: [assessment]
    then:
      properties:
        assessment:
          type: object
          properties:
            static_visibility: {const: full}
            missing: {type: array, maxItems: 0}
            uncertainties: {type: array, maxItems: 0}
        sandbox_requirements:
          $ref: "#/$defs/sandboxRequirements"
  - if:
      properties:
        assessment:
          type: object
          properties:
            status: {const: incomplete}
          required: [status]
      required: [assessment]
    then:
      properties:
        assessment:
          type: object
          properties:
            static_visibility:
              type: string
              enum: [full, partial, none]
            missing: {type: array, minItems: 1}
        sandbox_requirements:
          type: "null"
  - if:
      properties:
        assessment:
          type: object
          properties:
            status: {const: uncertain}
          required: [status]
      required: [assessment]
    then:
      properties:
        assessment:
          type: object
          properties:
            static_visibility: {type: string, const: unknown}
            missing: {type: array, maxItems: 0}
            uncertainties: {type: array, minItems: 1}
        sandbox_requirements:
          type: "null"

$defs:
  confidence:
    type: number
    minimum: 0
    maximum: 1

  shortText:
    type: string
    minLength: 1
    maxLength: 512
    pattern: "^[^\\x00-\\x1F]*$"

  projectText:
    type: string
    minLength: 1
    maxLength: 256
    pattern: "^[^\\x00-\\x1F]*$"

  fixText:
    type: string
    minLength: 1
    maxLength: 384
    pattern: "^[^\\x00-\\x1F]*$"

  identifier:
    type: string
    minLength: 1
    maxLength: 64
    pattern: "^[a-z][a-z0-9_.:-]*$"

  relativePath:
    type: string
    minLength: 1
    maxLength: 512
    pattern: "^(?:\\.|(?!/)(?![A-Za-z]:)(?!.*\\\\)(?!.*(?:^|/)\\.\\.(?:/|$))[^\\x00-\\x1F]+)$"

  stageName:
    type: string
    enum: [static_audit, build, poc, exp]

  evidenceSignal:
    type: string
    enum:
      - project_metadata
      - build_entrypoint
      - dependency_declaration
      - missing_reference
      - source_tree_shape
      - generated_source_reference
      - submodule_reference
      - container_definition
      - full_system_indicator
      - asset_reference
      - documentation
      - other

  evidence:
    type: object
    additionalProperties: false
    required: [path, signal, observation]
    properties:
      path: {$ref: "#/$defs/relativePath"}
      line_start:
        type: integer
        minimum: 1
        maximum: 10000000
      line_end:
        type: integer
        minimum: 1
        maximum: 10000000
      signal: {$ref: "#/$defs/evidenceSignal"}
      observation: {$ref: "#/$defs/shortText"}

  missingComponent:
    type: object
    additionalProperties: false
    required: [category, name, required_by, evidence_paths, impact, recoverable_from_submission, recommendation_codes, fix]
    properties:
      category:
        type: string
        enum: [base_source, first_party_component, submodule, generated_source, build_manifest, dependency, asset, configuration, unknown]
      name: {$ref: "#/$defs/shortText"}
      required_by: {$ref: "#/$defs/shortText"}
      evidence_paths:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/relativePath"}
      impact:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items: {$ref: "#/$defs/stageName"}
      recoverable_from_submission:
        type: boolean
      recommendation_codes:
        type: array
        minItems: 1
        maxItems: 3
        uniqueItems: true
        items: {$ref: "#/$defs/recommendationCode"}
      fix: {$ref: "#/$defs/fixText"}

  uncertainty:
    type: object
    additionalProperties: false
    required: [code, description, evidence_paths, impact, recommendation_codes, fix]
    properties:
      code:
        type: string
        enum: [ambiguous_scope, conflicting_evidence, unreadable_required_file, unsupported_manifest, insufficient_evidence, unknown]
      description: {$ref: "#/$defs/shortText"}
      evidence_paths:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/relativePath"}
      impact:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items: {$ref: "#/$defs/stageName"}
      recommendation_codes:
        type: array
        minItems: 1
        maxItems: 3
        uniqueItems: true
        items: {$ref: "#/$defs/recommendationCode"}
      fix: {$ref: "#/$defs/fixText"}

  recommendationCode:
    type: string
    enum: [submit_complete_project, include_base_source, include_submodules, include_generated_sources_or_generator, include_build_files, separate_projects, provide_asset, clarify_scope, contact_admin, retry, other]

  externalDependency:
    type: object
    additionalProperties: false
    required: [name, role, availability, integrity, required_for, declared_by, locator_hint]
    properties:
      name: {$ref: "#/$defs/shortText"}
      role:
        type: string
        enum: [base_project_source, first_party_component, submodule, generated_source_tool, system_package, language_package, build_tool, runtime_service, dataset, other, unknown]
      availability:
        type: string
        enum: [present, declared_download, missing, unknown]
      integrity:
        type: string
        enum: [pinned, unpinned, unknown, not_applicable]
      required_for:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items: {$ref: "#/$defs/stageName"}
      declared_by:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/relativePath"}
      locator_hint:
        type: string
        maxLength: 256
        pattern: "^[^\\x00-\\x1F]*$"

  assessment:
    type: object
    additionalProperties: false
    required:
      - status
      - submission_shape
      - intended_project
      - root_candidates
      - confidence
      - static_visibility
      - evidence
      - missing
      - uncertainties
      - external_dependencies
    properties:
      status:
        type: string
        enum: [complete, incomplete, uncertain]
      submission_shape:
        type: string
        enum: [project, monorepo, multi_project, patch_set, test_corpus, vendor_fragment, unknown]
      intended_project: {$ref: "#/$defs/projectText"}
      root_candidates:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/relativePath"}
      confidence: {$ref: "#/$defs/confidence"}
      static_visibility:
        type: string
        enum: [full, partial, none, unknown]
      evidence:
        type: array
        minItems: 1
        maxItems: 64
        items: {$ref: "#/$defs/evidence"}
      missing:
        type: array
        maxItems: 32
        items: {$ref: "#/$defs/missingComponent"}
      uncertainties:
        type: array
        maxItems: 16
        items: {$ref: "#/$defs/uncertainty"}
      external_dependencies:
        type: array
        maxItems: 32
        items: {$ref: "#/$defs/externalDependency"}

  requiredAsset:
    type: object
    additionalProperties: false
    required: [asset_type, asset_id, version_constraint, architecture, os_family, reason]
    properties:
      asset_type:
        type: string
        enum: [guest_image, firmware, kernel, rootfs, container_image, toolchain, dataset, other]
      asset_id: {$ref: "#/$defs/identifier"}
      version_constraint:
        type: string
        minLength: 1
        maxLength: 128
      architecture: {$ref: "#/$defs/identifier"}
      os_family: {$ref: "#/$defs/identifier"}
      reason: {$ref: "#/$defs/shortText"}

  target:
    type: object
    additionalProperties: false
    required: [project_types, languages, build_systems, architectures, os_families, target_classes]
    properties:
      project_types:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      languages:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      build_systems:
        type: array
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      architectures:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      os_families:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      target_classes:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}

  executionRequirements:
    type: object
    additionalProperties: false
    required: [full_system, nested_docker, qemu_guest]
    properties:
      full_system: {type: boolean}
      nested_docker: {type: boolean}
      qemu_guest: {type: boolean}

  dependencyEgress:
    type: object
    additionalProperties: false
    required: [required, reasons]
    properties:
      required: {type: boolean}
      reasons:
        type: array
        maxItems: 16
        items: {$ref: "#/$defs/shortText"}
    allOf:
      - if:
          type: object
          properties:
            required: {const: true}
          required: [required]
        then:
          type: object
          properties:
            reasons: {type: array, minItems: 1}
      - if:
          type: object
          properties:
            required: {const: false}
          required: [required]
        then:
          type: object
          properties:
            reasons: {type: array, maxItems: 0}

  sandboxRequirements:
    type: object
    additionalProperties: false
    required: [target, required_capabilities, execution, dependency_egress, confidence]
    properties:
      target: {$ref: "#/$defs/target"}
      required_capabilities:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      optional_capabilities:
        type: array
        maxItems: 32
        uniqueItems: true
        items: {$ref: "#/$defs/identifier"}
      execution: {$ref: "#/$defs/executionRequirements"}
      required_assets:
        type: array
        maxItems: 32
        items: {$ref: "#/$defs/requiredAsset"}
      dependency_egress: {$ref: "#/$defs/dependencyEgress"}
      confidence: {$ref: "#/$defs/confidence"}
