type: object
required: [total_findings, reproduction_rate, findings]
properties:
  target_url:
    type: string
  total_findings:
    type: integer
  reproduced:
    type: integer
  partially_reproduced:
    type: integer
  not_reproduced:
    type: integer
  skipped:
    type: integer
  reproduction_rate:
    type: number
    minimum: 0
    maximum: 1
  findings:
    type: array
    items:
      $ref: "poc-result.schema.yaml"
