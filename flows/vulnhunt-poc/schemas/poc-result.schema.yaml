type: object
required: [bug_id, vuln_type, status]
properties:
  bug_id:
    type: string
  vuln_type:
    type: string
  severity:
    type: string
    enum: [high, medium, low, info]
  endpoint:
    type: string
  status:
    type: string
    enum: [REPRODUCED, PARTIALLY_REPRODUCED, NOT_REPRODUCED, SKIPPED]
  evidence:
    type: string
  poc_script:
    type: string
  screenshot:
    type: string
  reproduction_steps:
    type: array
    items: { type: string }
