type: object
required: [ready, target_url, deploy_mode]
properties:
  ready:
    type: boolean
    description: 目标服务是否就绪
  target_url:
    type: string
    description: 目标访问地址
  deploy_mode:
    type: string
    enum: [auto_deploy, provided]
  services:
    type: array
    items:
      type: object
      properties:
        name: { type: string }
        port: { type: integer }
        status: { type: string }
  failure_reason:
    type: string
    description: 失败原因（如果 ready=false）
