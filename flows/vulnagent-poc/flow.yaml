# VulnAgent POC Flow — 漏洞复现验证流水线
version: "1.0"

artifacts:
  agents: agents/
  skills: skills/
  tasks: tasks/
  schemas: schemas/
  env_file: .env

defaults:
  model: anthropic/claude-sonnet-4-6:medium
  max_parallel: 1
  agent: poc-expert.md
  tools:
    - read
    - bash
    - write
    - edit
  extensions:
    - output-contract

inputs:
  work_dir: { type: path }
  output_dir: { type: path }
  target_mode: { type: str, required: true }
  target_url: { type: str }
  browser_tool: { type: str, default: deveye }
  custom_instructions: { type: str }

stages:
  # ====================================================================
  # Stage 1: 部署或检测目标服务
  # ====================================================================
  - id: prepare-target
    name: 部署或检测目标服务
    skills:
      - poc-target
    task: prepare-target.md
    prompt: |
      源码目录: ${work_dir}
      输出目录: ${output_dir}/target/
      目标模式: ${flow_inputs.target_mode}
      用户提供目标地址: ${flow_inputs.target_url}
      自定义指令: ${flow_inputs.custom_instructions}
    timeout: 1800
    state:
      target_ready:
        file: target/target-info.yaml
        field: ready
    routes:
      - to: generate-and-run-poc
        when: prepare-target.target_ready == true
      - to: aggregate-report

  # ====================================================================
  # Stage 2: 按漏洞生成并执行 POC (map 节点)
  # ====================================================================
  - id: generate-and-run-poc
    name: 按漏洞生成并执行 POC
    type: map
    over: "input/findings/BUG-*.yaml"
    concurrency: 1
    skills:
      - poc-reproducer
      - poc-executor
      - deveye
    task: generate-and-run-poc.md
    extensions:
      - output-contract
    prompt: |
      源码目录: ${work_dir}
      当前漏洞报告: ${iterate_file}
      目标服务信息: ${output_dir}/target/target-info.yaml
      浏览器工具: ${flow_inputs.browser_tool}
      自定义指令: ${flow_inputs.custom_instructions}
      输出根目录: ${output_dir}/findings/
    timeout: 1800
    routes:
      - to: aggregate-report

  # ====================================================================
  # Stage 3: 汇总 POC 复现报告
  # ====================================================================
  - id: aggregate-report
    name: 汇总 POC 复现报告
    skills:
      - poc-report
    task: aggregate-report.md
    prompt: |
      POC 结果目录: ${output_dir}/findings/
      目标服务信息: ${output_dir}/target/target-info.yaml
      输出目录: ${output_dir}/
    timeout: 600
