server {
  listen 80;
  server_name _;

  client_max_body_size ${UPLOAD_GATEWAY_LIMIT_MB}m;

  root /usr/share/nginx/html;
  index index.html;

  # Admin API only — no /mcp /ws on management entry
  location /api/ {
    proxy_pass http://admin-api:28080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static assets
  location /assets/ {
    try_files $uri =404;
  }

  # Converge non-admin page routes to /admin
  location /admin {
    try_files $uri $uri/ /index.html;
  }

  location = / {
    return 302 /admin;
  }

  location / {
    # Allow vite hashed files and favicon etc.
    if ($uri ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|map|txt|webp)$) {
      break;
    }
    return 302 /admin;
  }
}
