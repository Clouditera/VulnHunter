server {
  listen 80;
  server_name _;

  client_max_body_size ${UPLOAD_GATEWAY_LIMIT_MB}m;

  root /usr/share/nginx/html;
  index index.html;

  # Admin API only — no /mcp /ws on management entry
  location /api/ {
    proxy_pass http://admin-api:28080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite static assets — content-hashed, safe to cache long-term
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # SPA shell — always revalidate (fish 2026-08-06: 升级后浏览器启发式缓存旧壳);
  # revalidation is cheap (ETag 304) and hashed assets stay long-cached.
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  # Root → admin console (preserve Host incl. published port via $http_host)
  location = / {
    return 302 $scheme://$http_host/admin;
  }

  # SPA fallback for all other paths (admin/login/activate/...).
  # try_files internal redirect to /index.html is handled by `location = /index.html` above,
  # so it never hits a 302 and cannot loop.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
