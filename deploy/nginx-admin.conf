server {
  listen 80;
  server_name _;

  client_max_body_size ${UPLOAD_GATEWAY_LIMIT_MB}m;

  root /usr/share/nginx/html;
  index index.html;

  # Admin API only — no /mcp /ws on management entry
  location /api/ {
    proxy_pass http://admin-api:28080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite static assets
  location /assets/ {
    try_files $uri =404;
  }

  # Serve SPA shell explicitly — must not fall into redirect locations
  location = /index.html {
    try_files $uri =404;
  }

  # Root → admin console (preserve Host incl. published port via $http_host)
  location = / {
    return 302 $scheme://$http_host/admin;
  }

  # SPA fallback for all other paths (admin/login/activate/...).
  # try_files internal redirect to /index.html is handled by `location = /index.html` above,
  # so it never hits a 302 and cannot loop.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
