version: "3.9"

services:
  web:
    image: ${WEB_IMAGE:-vulnhunter-web:latest}
    container_name: vulnhunter-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-23000}:80"
    environment:
      UPLOAD_GATEWAY_LIMIT_MB: "${UPLOAD_GATEWAY_LIMIT_MB:-2048}"
    networks:
      - vulnhunter-internal
    depends_on:
      service:
        condition: service_started

  service:
    image: ${SERVICE_IMAGE:-vulnhunter-service:latest}
    container_name: vulnhunter-service
    restart: unless-stopped
    user: "${SERVICE_UID:-1001}:${SERVICE_GID:-1001}"
    ports:
      - "${SERVICE_PORT:-28080}:28080"
    environment:
      NODE_ENV: "production"
      EDITION: "${EDITION:-community}"
      SERVICE_ROLE: "business"
      PORT: "28080"
      DATABASE_URL: "postgresql://vulnhunter:${DB_PASSWORD:-vulnhunter}@db:5432/vulnhunter"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "artifact-store"
      DOCKER_SOCKET: "/var/run/docker.sock"
      WORKER_IMAGE: "${WORKER_IMAGE:-vulnhunter-worker:latest}"
      DOCKER_NETWORK: "${DOCKER_NETWORK:-vulnhunter-internal}"
      WORKER_SERVICE_URL: "${WORKER_SERVICE_URL:-http://service:28080}"
      UPLOAD_GATEWAY_LIMIT_MB: "${UPLOAD_GATEWAY_LIMIT_MB:-2048}"
      DATA_DIR: "${DATA_DIR:-/opt/vulnhunter/data}"
      VULNHUNTER_MASTER_KEY_FILE: "${VULNHUNTER_MASTER_KEY_FILE:-/run/secrets/vulnhunter-master.key}"
      VULNHUNTER_LICENSE_PUBLIC_KEY_FILE: "${VULNHUNTER_LICENSE_PUBLIC_KEY_FILE:-/run/secrets/license-public.pem}"
      # Singleton system admin (deploy-provisioned). Empty = skip provision.
      VULNHUNTER_ADMIN_EMAIL: "${VULNHUNTER_ADMIN_EMAIL:-}"
      VULNHUNTER_ADMIN_PASSWORD: "${VULNHUNTER_ADMIN_PASSWORD:-}"
      # SandboxPlane integration (dynamic verification). Empty = not configured;
      # static scans unaffected, dynamic tasks fail closed with a visible reason.
      SANDBOXPLANE_BASE_URL: "${SANDBOXPLANE_BASE_URL:-}"
      SANDBOXPLANE_TOKEN: "${SANDBOXPLANE_TOKEN:-}"
      SANDBOX_SSH_HOST_OVERRIDE: "${SANDBOX_SSH_HOST_OVERRIDE:-}"
      # Bastion jump (empty = direct port-mapping). Host key pins bastion hop.
      SANDBOX_SSH_BASTION: "${SANDBOX_SSH_BASTION:-}"
      SANDBOX_SSH_BASTION_HOST_KEY: "${SANDBOX_SSH_BASTION_HOST_KEY:-}"
      SANDBOX_SSH_BASTION_IDENTITY: "${SANDBOX_SSH_BASTION_IDENTITY:-}"
      # Former POC settings live fields (UI offline)
      POC_RUN_TIMEOUT_S: "${POC_RUN_TIMEOUT_S:-1800}"
      EVAL_CONTAINER_NETWORK: "${EVAL_CONTAINER_NETWORK:-bridge}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DATA_DIR:-/opt/vulnhunter/data}:${DATA_DIR:-/opt/vulnhunter/data}"
      - "${MASTER_KEY_FILE:-./.secrets/vulnhunter-master.key}:/run/secrets/vulnhunter-master.key:ro"
      - "${LICENSE_PUBLIC_KEY_FILE:-./.secrets/license-public.pem}:/run/secrets/license-public.pem:ro"
    networks:
      - vulnhunter-internal
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Admin console API — same image, SERVICE_ROLE=admin; no docker.sock, no public ports
  admin-api:
    image: ${SERVICE_IMAGE:-vulnhunter-service:latest}
    container_name: vulnhunter-admin-api
    restart: unless-stopped
    user: "${SERVICE_UID:-1001}:${SERVICE_GID:-1001}"
    environment:
      NODE_ENV: "production"
      EDITION: "${EDITION:-community}"
      SERVICE_ROLE: "admin"
      PORT: "28080"
      DATABASE_URL: "postgresql://vulnhunter:${DB_PASSWORD:-vulnhunter}@db:5432/vulnhunter"
      DATA_DIR: "${DATA_DIR:-/opt/vulnhunter/data}"
      VULNHUNTER_MASTER_KEY_FILE: "${VULNHUNTER_MASTER_KEY_FILE:-/run/secrets/vulnhunter-master.key}"
      VULNHUNTER_LICENSE_PUBLIC_KEY_FILE: "${VULNHUNTER_LICENSE_PUBLIC_KEY_FILE:-/run/secrets/license-public.pem}"
      VULNHUNTER_ADMIN_EMAIL: "${VULNHUNTER_ADMIN_EMAIL:-}"
      VULNHUNTER_ADMIN_PASSWORD: "${VULNHUNTER_ADMIN_PASSWORD:-}"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "artifact-store"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - "${DATA_DIR:-/opt/vulnhunter/data}:${DATA_DIR:-/opt/vulnhunter/data}"
      - "${MASTER_KEY_FILE:-./.secrets/vulnhunter-master.key}:/run/secrets/vulnhunter-master.key:ro"
      - "${LICENSE_PUBLIC_KEY_FILE:-./.secrets/license-public.pem}:/run/secrets/license-public.pem:ro"
    networks:
      - vulnhunter-internal
    depends_on:
      db:
        condition: service_healthy
      service:
        condition: service_started

  # Admin console web — default bind 127.0.0.1:23001 (localhost only)
  admin-web:
    image: ${WEB_IMAGE:-vulnhunter-web:latest}
    container_name: vulnhunter-admin-web
    restart: unless-stopped
    ports:
      - "${ADMIN_LISTEN_ADDR:-0.0.0.0}:${ADMIN_PORT:-23001}:80"
    environment:
      UPLOAD_GATEWAY_LIMIT_MB: "${UPLOAD_GATEWAY_LIMIT_MB:-2048}"
      NGINX_ROLE: "admin"
    networks:
      - vulnhunter-internal
    depends_on:
      admin-api:
        condition: service_started

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: vulnhunter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vulnhunter
      POSTGRES_USER: vulnhunter
      POSTGRES_PASSWORD: "${DB_PASSWORD:-vulnhunter}"
    volumes:
      - "${DATA_DIR:-/opt/vulnhunter/data}/db:/var/lib/postgresql/data"
    networks:
      - vulnhunter-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnhunter -d vulnhunter"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: vulnhunter-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - "${DATA_DIR:-/opt/vulnhunter/data}/minio:/data"
    networks:
      - vulnhunter-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  vulnhunter-internal:
    driver: bridge
    # Single source of truth: .env DOCKER_NETWORK (install derives it from
    # PROJECT_NAME). Default keeps the legacy shared name for old installs.
    name: ${DOCKER_NETWORK:-vulnhunter-internal}
    # Pin the Docker bridge subnet to avoid collisions with customer LAN/VPN routes.
    # Override DOCKER_SUBNET in .env if 10.177.0.0/24 conflicts in the target environment.
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.177.0.0/24}
