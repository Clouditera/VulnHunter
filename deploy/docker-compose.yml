version: "3.9"

services:
  service:
    image: vulnhunt-service:latest
    container_name: vulnhunt-service
    restart: unless-stopped
    ports:
      - "${PORT:-28080}:28080"
    environment:
      PORT: "28080"
      DATABASE_URL: "postgresql://vulnhunt:${DB_PASSWORD:-vulnhunt}@db:5432/vulnhunt"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"  # internal container port, not host
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "vulnhunt"
      DOCKER_SOCKET: "/var/run/docker.sock"
      WORKER_IMAGE: "vulnhunt-worker:latest"
      DOCKER_NETWORK: "vulnhunt-internal"
      DATA_DIR: "/data/vulnhunt"
      VULNHUNT_MASTER_KEY_FILE: "${VULNHUNT_MASTER_KEY_FILE:-/run/secrets/vulnhunt-master.key}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vulnhunt-data:/data/vulnhunt
      - "${MASTER_KEY_FILE:-../.data/.master.key}:/run/secrets/vulnhunt-master.key:ro"
    networks:
      - vulnhunt-internal
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: vulnhunt-db
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-25432}:5432"
    environment:
      POSTGRES_DB: vulnhunt
      POSTGRES_USER: vulnhunt
      POSTGRES_PASSWORD: "${DB_PASSWORD:-vulnhunt}"
    volumes:
      - vulnhunt-db:/var/lib/postgresql/data
    networks:
      - vulnhunt-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnhunt -d vulnhunt"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: vulnhunt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - vulnhunt-minio:/data
    networks:
      - vulnhunt-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vulnhunt-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${DATA_DIR:-/data/vulnhunt}"
  vulnhunt-db:
    driver: local
  vulnhunt-minio:
    driver: local

networks:
  vulnhunt-internal:
    driver: bridge
    name: vulnhunt-internal
