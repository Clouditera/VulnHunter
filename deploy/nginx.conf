server {
  listen 80;
  server_name _;

  client_max_body_size ${UPLOAD_GATEWAY_LIMIT_MB}m;

  root /usr/share/nginx/html;
  index index.html;

  # Credential test stream (SSE, L1-L4): L4 can be silent up to 120s while the
  # agent runs — nginx default 60s read timeout cut it mid-run (fish 2026-08-06
  # spinning-forever case). 180s > worst-case 120s layer timeout; buffering off
  # so frames flush immediately. Longest-prefix match beats the /api/ block.
  # (Server also sends 30s heartbeat frames as a second layer of keepalive.)
  location /api/settings/credential/diagnose-stream {
    proxy_pass http://service:28080/api/settings/credential/diagnose-stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://service:28080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /mcp {
    proxy_pass http://service:28080/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    proxy_pass http://service:28080/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Vite static assets — content-hashed, safe to cache long-term
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # SPA shell — always revalidate (fish 2026-08-06: 升级后浏览器启发式缓存旧壳);
  # revalidation is cheap (ETag 304) and hashed assets stay long-cached.
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
